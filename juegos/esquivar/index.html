<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esquivar</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Todos los juegos</a>
    <header>
      <h1>Esquivar</h1>
      <div class="scores"><span>Puntos: <b id="score">0</b></span><span>Récord: <b id="best">0</b></span></div>
    </header>
    <div class="stage">
      <canvas id="game" width="400" height="500" aria-label="Zona de juego"></canvas>
      <div id="overlay" class="overlay">
        <p id="text">Evita los bloques que caen</p>
        <button id="start" class="btn">Jugar</button>
      </div>
    </div>
    <div class="pad">
      <button id="left" aria-label="Izquierda">◀</button>
      <button id="right" aria-label="Derecha">▶</button>
    </div>
    <p class="hint">Flechas o A / D. En móvil, arrastra el dedo o usa los botones.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
