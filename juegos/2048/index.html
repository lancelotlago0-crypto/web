<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Todos los juegos</a>
    <header>
      <h1>2048</h1>
      <div class="scores"><span>Puntos: <b id="score">0</b></span><span>Récord: <b id="best">0</b></span></div>
    </header>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div id="overlay" class="overlay hidden">
        <p id="text"></p>
        <div class="actions">
          <button id="keep" class="btn hidden">Seguir jugando</button>
          <button id="again" class="btn">Nueva partida</button>
        </div>
      </div>
    </div>
    <p class="hint">Flechas o WASD para mover. En móvil, desliza sobre el tablero. Une números iguales.</p>
    <p style="text-align:center"><button id="restart" class="btn">Nueva partida</button></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
