<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tres en raya</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Todos los juegos</a>

      <div class="scores"><span>Tú: <b id="sx">0</b></span><span>Rival: <b id="so">0</b></span></div>

    <p style="text-align:center"><button id="restart" class="btn">Nueva partida</button></p>
  </main>
  <script src="script.js"></script>
